[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "battery-soh"
version = "0.5.0-alpha.1"
description = "Battery State of Health Prediction Framework with Missing Data Support"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Battery SOH Research Team"},
]
keywords = [
    "battery",
    "soh",
    "prognostics",
    "missing-data",
    "deep-learning",
    "pytorch"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.0.0",
    "pytorch-lightning>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
    "pre-commit>=3.0.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
]

[project.urls]
Homepage = "https://github.com/battery-soh/battery-soh-framework"
Documentation = "https://battery-soh.readthedocs.io"
Repository = "https://github.com/battery-soh/battery-soh-framework"
Issues = "https://github.com/battery-soh/battery-soh-framework/issues"

[tool.hatch.build.targets.wheel]
packages = ["battery_soh"]

[tool.ruff]
target-version = "py310"
line-length = 100
select = ["E", "F", "I", "W", "N", "D"]
ignore = ["D100", "D104"]  # Missing docstrings in __init__ and public modules

[tool.ruff.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=battery_soh --cov-report=term-missing"

[tool.coverage.run]
source = ["battery_soh"]
omit = ["*/tests/*", "*/test_*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]
