<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baseline vs MIM Comparison</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: white;
            width: 750px;
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid #e9ecef;
        }
        
        .content-wrapper {
            display: flex;
            gap: 15px;
        }
        
        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .panel-title {
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 10px;
            color: #1a202c;
            padding-bottom: 6px;
            border-bottom: 2px solid #e9ecef;
        }
        
        .flow {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        
        /* Unified compact block */
        .block {
            width: 160px;
            height: 55px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }
        
        .block-title {
            font-size: 15px;
            font-weight: 700;
            color: #fff;
        }
        .block-subtitle {
            font-size: 10px;
            color: rgba(255,255,255,0.9);
            margin-top: 2px;
        }
        
        /* Colors */
        .input-block { background: #4472C4; }
        .model-block { background: #70AD47; }
        .output-block { background: #ED7D31; }
        .indicator-block { background: #C5504B; }
        .concat-block { background: #7030A0; }
        
        /* Compact arrow */
        .arrow-v {
            width: 2px;
            height: 15px;
            background: #5B5B5B;
            position: relative;
        }
        .arrow-v::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: -4px;
            border-top: 6px solid #5B5B5B;
            border-left: 5px solid transparent;
            border-right: 5px solid transparent;
        }
        
        /* Plus sign */
        .plus-sign {
            font-size: 18px;
            font-weight: 700;
            color: #5B5B5B;
        }
        
        /* Horizontal input group */
        .input-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .small-block {
            width: 90px;
            height: 55px;
        }
        
        /* Concat indicator */
        .concat-indicator {
            font-size: 9px;
            color: #5B5B5B;
            font-style: italic;
            font-weight: 500;
        }
        
        sub {
            font-size: 0.7em;
            vertical-align: sub;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="content-wrapper">
            <!-- Left: Baseline -->
            <div class="panel">
                <div class="panel-title">(a) Baseline: Imputation Only</div>
                <div class="flow">
                    <div class="block input-block">
                        <div class="block-title">X&#770;</div>
                        <div class="block-subtitle">Imputed Features (16D)</div>
                    </div>
                    <div class="arrow-v"></div>
                    <div class="block model-block">
                        <div class="block-title"><em>f</em>(&middot;)</div>
                        <div class="block-subtitle">Neural Network</div>
                    </div>
                    <div class="arrow-v"></div>
                    <div class="block output-block">
                        <div class="block-title"><em>y</em>&#770;</div>
                        <div class="block-subtitle">SOH Prediction</div>
                    </div>
                </div>
            </div>
            
            <!-- Right: MIM -->
            <div class="panel">
                <div class="panel-title">(b) MIM: Imputation + Missing Indicator</div>
                <div class="flow">
                    <div class="input-group">
                        <div class="block small-block input-block">
                            <div class="block-title">X&#770;</div>
                            <div class="block-subtitle">Imputed (16D)</div>
                        </div>
                        <div class="plus-sign">+</div>
                        <div class="block small-block indicator-block">
                            <div class="block-title"><em>M</em></div>
                            <div class="block-subtitle">Indicator (16D)</div>
                        </div>
                    </div>
                    <div class="concat-indicator">↓ Concatenate ↓</div>
                    <div class="block concat-block">
                        <div class="block-title"><em>Z</em> = [X&#770; | <em>M</em>]</div>
                        <div class="block-subtitle">Concatenated (32D)</div>
                    </div>
                    <div class="arrow-v"></div>
                    <div class="block model-block">
                        <div class="block-title"><em>f</em>(&middot;)</div>
                        <div class="block-subtitle">Neural Network</div>
                    </div>
                    <div class="arrow-v"></div>
                    <div class="block output-block">
                        <div class="block-title"><em>y</em>&#770;</div>
                        <div class="block-subtitle">SOH Prediction</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
