# Phase 1: LSTM + MIM实验
name: "phase1_lstm_mim"
seed: 42
n_repeats: 1

# 数据配置
data:
  data_dir: "../data/raw/XJTU"
  batch: "3C"
  test_size: 0.25
  val_size: 0.25
  target_col: "capacity"
  feature_cols:
    - 'voltage mean'
    - 'voltage std'
    - 'voltage kurtosis'
    - 'voltage skewness'
    - 'CC Q'
    - 'CC charge time'
    - 'voltage slope'
    - 'voltage entropy'
    - 'current mean'
    - 'current std'
    - 'current kurtosis'
    - 'current skewness'
    - 'CV Q'
    - 'CV charge time'
    - 'current slope'
    - 'current entropy'

# 训练配置
training:
  epochs: 200
  batch_size: 32
  lr: 0.001
  optimizer: "Adam"
  weight_decay: 0.0
  early_stopping_patience: 30
  min_epochs: 10
  use_scheduler: true
  scheduler_patience: 5
  scheduler_factor: 0.5
  # 使用MIM
  use_mim: true
  # 训练插补方法
  imputation_method: "zero"
  # MIM使用20档缺失率训练
  training_missing_rates:
    - 0.0
    - 0.05
    - 0.1
    - 0.15
    - 0.2
    - 0.25
    - 0.3
    - 0.35
    - 0.4
    - 0.45
    - 0.5
    - 0.55
    - 0.6
    - 0.65
    - 0.7
    - 0.75
    - 0.8
    - 0.85
    - 0.9
    - 0.95
  seq_len: 5
  
  # 验证指标配置
  validation:
    val_mr_subset: [-1]
    base_metric: "mae"
    aggregation: "mean"

# 评估配置
evaluation:
  missing_rates:
    - 0.0
    - 0.05
    - 0.1
    - 0.15
    - 0.2
    - 0.25
    - 0.3
    - 0.35
    - 0.4
    - 0.45
    - 0.5
    - 0.55
    - 0.6
    - 0.65
    - 0.7
    - 0.75
    - 0.8
    - 0.85
    - 0.9
    - 0.95
  missing_modes:
    - "MCAR"
    - "MAR"
    - "MNAR"
  imputation_methods:
    - "zero"
    - "mean"
    - "knn"
    - "iterative"

# 模型架构配置路径
model_config_path: "configs/models/lstm_default.yaml"

# 输出配置
output_dir: "./results"

# 设备配置
device: "auto"
