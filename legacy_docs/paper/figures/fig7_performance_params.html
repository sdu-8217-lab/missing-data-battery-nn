<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Figure 7</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Times New Roman', Times, serif;
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .figure-container {
            background: white;
            width: 800px;
            height: 520px;
            padding: 15px 20px;
        }
        .panel-title {
            font-family: 'Times New Roman', Times, serif;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 15px;
            color: #000;
        }
        .panel-content {
            height: 460px;
            position: relative;
            padding: 10px 60px 50px 70px;
        }
        
        /* Axes */
        .axis-x {
            position: absolute;
            bottom: 50px;
            left: 70px;
            right: 60px;
            height: 2.5px;
            background: #333;
        }
        .axis-y {
            position: absolute;
            left: 70px;
            top: 10px;
            bottom: 50px;
            width: 2.5px;
            background: #333;
        }
        .axis-x::after {
            content: '';
            position: absolute;
            right: -10px;
            top: -5px;
            border-left: 10px solid #333;
            border-top: 6px solid transparent;
            border-bottom: 6px solid transparent;
        }
        .axis-y::after {
            content: '';
            position: absolute;
            top: -10px;
            left: -5px;
            border-bottom: 10px solid #333;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
        }
        .x-label {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 13px;
            font-weight: bold;
        }
        .y-label {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%) rotate(-90deg);
            font-size: 13px;
            font-weight: bold;
            transform-origin: center;
        }
        
        /* Grid */
        .grid-line-h {
            position: absolute;
            left: 70px;
            right: 60px;
            height: 1.5px;
            background: #e0e0e0;
        }
        .grid-line-v {
            position: absolute;
            top: 10px;
            bottom: 50px;
            width: 1.5px;
            background: #e0e0e0;
        }
        
        /* Ticks */
        .tick-x {
            position: absolute;
            bottom: 46px;
            width: 2.5px;
            height: 10px;
            background: #333;
        }
        .tick-y {
            position: absolute;
            left: 66px;
            width: 10px;
            height: 2.5px;
            background: #333;
        }
        .tick-label-x {
            position: absolute;
            bottom: 22px;
            transform: translateX(-50%);
            font-size: 11px;
            color: #333;
        }
        .tick-label-y {
            position: absolute;
            left: 38px;
            transform: translateY(-50%);
            font-size: 11px;
            color: #333;
            text-align: right;
            width: 25px;
        }
        
        /* Data points */
        .point {
            position: absolute;
            transform: translate(-50%, -50%);
        }
        .point-mim {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 3px solid white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .point-base {
            width: 14px;
            height: 14px;
            border: 2.5px solid;
            transform: translate(-50%, -50%) rotate(45deg);
        }
        .mlp { background: #1f77b4; }
        .lstm { background: #ff7f0e; }
        .gru { background: #2ca02c; }
        .cnn { background: #d62728; }
        .base-mlp { border-color: #1f77b4; background: white; }
        .base-lstm { border-color: #ff7f0e; background: white; }
        .base-gru { border-color: #2ca02c; background: white; }
        .base-cnn { border-color: #d62728; background: white; }
        
        /* Labels */
        .point-label {
            position: absolute;
            font-size: 11px;
            color: #000;
            white-space: nowrap;
            text-align: center;
            line-height: 1.3;
            font-family: 'Times New Roman', Times, serif;
        }
        
        /* Pareto arrow annotation */
        .pareto-annotation {
            position: absolute;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .pareto-text {
            font-size: 13px;
            color: #2ca02c;
            font-weight: bold;
            font-family: 'Times New Roman', Times, serif;
        }
        .pareto-arrow-h {
            width: 40px;
            height: 2.5px;
            background: #2ca02c;
            position: relative;
        }
        .pareto-arrow-h::after {
            content: '';
            position: absolute;
            right: 0;
            top: -5px;
            border-left: 10px solid #2ca02c;
            border-top: 6px solid transparent;
            border-bottom: 6px solid transparent;
        }
        
        /* Legend */
        .legend {
            position: absolute;
            top: 20px;
            right: 60px;
            background: rgba(255,255,255,0.98);
            border: 1.5px solid #ccc;
            border-radius: 8px;
            padding: 12px;
            font-size: 11px;
            font-family: 'Times New Roman', Times, serif;
        }
        .legend-title {
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 12px;
        }
        .legend-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }
        .legend-symbol {
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .legend-circle {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #888;
        }
        .legend-cross {
            width: 12px;
            height: 12px;
            border: 2px solid #888;
            transform: rotate(45deg);
        }
        .legend-color {
            width: 14px;
            height: 14px;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="figure-container">
        <div class="panel-title">Performance-Parameter Trade-off Analysis (MR = 0.5)</div>
        <div class="panel-content">
            <!-- Grid -->
            <div class="grid-line-h" style="bottom: 130px;"></div>
            <div class="grid-line-h" style="bottom: 210px;"></div>
            <div class="grid-line-h" style="bottom: 290px;"></div>
            <div class="grid-line-h" style="bottom: 370px;"></div>
            <div class="grid-line-v" style="left: 150px;"></div>
            <div class="grid-line-v" style="left: 230px;"></div>
            <div class="grid-line-v" style="left: 310px;"></div>
            <div class="grid-line-v" style="left: 390px;"></div>
            <div class="grid-line-v" style="left: 470px;"></div>
            <div class="grid-line-v" style="left: 550px;"></div>
            
            <!-- Axes -->
            <div class="axis-x"></div>
            <div class="axis-y"></div>
            
            <!-- X ticks -->
            <div class="tick-x" style="left: 70px;"><div class="tick-label-x">10k</div></div>
            <div class="tick-x" style="left: 150px;"><div class="tick-label-x">20k</div></div>
            <div class="tick-x" style="left: 230px;"><div class="tick-label-x">30k</div></div>
            <div class="tick-x" style="left: 310px;"><div class="tick-label-x">40k</div></div>
            <div class="tick-x" style="left: 390px;"><div class="tick-label-x">50k</div></div>
            
            <!-- Y ticks -->
            <div class="tick-y" style="bottom: 50px;"><div class="tick-label-y">0.00</div></div>
            <div class="tick-y" style="bottom: 130px;"><div class="tick-label-y">0.10</div></div>
            <div class="tick-y" style="bottom: 210px;"><div class="tick-label-y">0.20</div></div>
            <div class="tick-y" style="bottom: 290px;"><div class="tick-label-y">0.30</div></div>
            <div class="tick-y" style="bottom: 370px;"><div class="tick-label-y">0.40</div></div>
            
            <div class="x-label">Number of Parameters</div>
            <div class="y-label">MAE (MR = 0.5)</div>
            
            <!-- Data points -->
            <!-- MLP Baseline -->
            <div class="point point-base base-mlp" style="left: 140px; bottom: 318px;"></div>
            <div class="point-label" style="left: 140px; bottom: 290px;">MLP<br>Baseline</div>
            
            <!-- MLP MIM -->
            <div class="point point-mim mlp" style="left: 280px; bottom: 134px;"></div>
            <div class="point-label" style="left: 280px; bottom: 108px;">MLP-MIM</div>
            
            <!-- LSTM Baseline -->
            <div class="point point-base base-lstm" style="left: 390px; bottom: 234px;"></div>
            <div class="point-label" style="left: 390px; bottom: 206px;">LSTM<br>Baseline</div>
            
            <!-- LSTM MIM -->
            <div class="point point-mim lstm" style="left: 410px; bottom: 78px;"></div>
            <div class="point-label" style="left: 410px; bottom: 52px;">LSTM-MIM</div>
            
            <!-- GRU Baseline -->
            <div class="point point-base base-gru" style="left: 372px; bottom: 276px;"></div>
            <div class="point-label" style="left: 372px; bottom: 304px;">GRU<br>Baseline</div>
            
            <!-- GRU MIM -->
            <div class="point point-mim gru" style="left: 410px; bottom: 72px;"></div>
            <div class="point-label" style="left: 448px; bottom: 72px;">GRU-MIM</div>
            
            <!-- CNN Baseline -->
            <div class="point point-base base-cnn" style="left: 156px; bottom: 352px;"></div>
            <div class="point-label" style="left: 156px; bottom: 382px;">1D-CNN<br>Baseline</div>
            
            <!-- CNN MIM -->
            <div class="point point-mim cnn" style="left: 200px; bottom: 72px;"></div>
            <div class="point-label" style="left: 200px; bottom: 46px;">1D-CNN-MIM</div>
            
            <!-- Pareto annotation -->
            <div class="pareto-annotation" style="left: 240px; bottom: 110px;">
                <div class="pareto-text">Pareto Front</div>
                <div class="pareto-arrow-h"></div>
            </div>
            
            <!-- Legend -->
            <div class="legend">
                <div class="legend-title">Legend</div>
                <div class="legend-row">
                    <div class="legend-symbol"><div class="legend-circle"></div></div>
                    <span>MIM Strategy</span>
                </div>
                <div class="legend-row">
                    <div class="legend-symbol"><div class="legend-cross"></div></div>
                    <span>Baseline</span>
                </div>
                <div style="margin-top: 8px; border-top: 1.5px solid #ddd; padding-top: 8px;">
                    <div class="legend-row">
                        <div class="legend-symbol"><div class="legend-color mlp"></div></div>
                        <span>MLP</span>
                    </div>
                    <div class="legend-row">
                        <div class="legend-symbol"><div class="legend-color lstm"></div></div>
                        <span>LSTM</span>
                    </div>
                    <div class="legend-row">
                        <div class="legend-symbol"><div class="legend-color gru"></div></div>
                        <span>GRU</span>
                    </div>
                    <div class="legend-row">
                        <div class="legend-symbol"><div class="legend-color cnn"></div></div>
                        <span>1D-CNN</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
