# @package _global_
# MLP + Baseline 快速运行配置

# 实验设置
experiment:
  name: paper_mlp_baseline
  seeds: [42]
  output_dir: ./results

method:
  name: baseline
  use_missing_indicator: false
  imputation: mean

model:
  name: mlp
  type: mlp
  input_dim: 16
  hidden_dims: [192, 96, 48, 24]
  dropout: 0.15
  activation: relu

missing_rates: [0.5]

training:
  optimizer: Adam
  learning_rate: 0.001
  batch_size: 64
  max_epochs: 5
  early_stopping_patience: 3

output:
  save_predictions: true

wandb:
  enabled: false

# 缺失数据处理
missing:
  mode: mcar
  missing_rates_eval: [0.5]

# 数据配置 (内联)
data:
  dataset: "xjtu"
  batch_id: "2C"
  data_dir: "./data/XJTU data"
  file_pattern: "{batch_id}_battery-*.csv"
  split:
    test_size: 0.25
    val_size: 0.25
    random_state: 42
  seq_len: 5
  features:
    - 'voltage mean'
    - 'voltage std'
    - 'voltage kurtosis'
    - 'voltage skewness'
    - 'current mean'
    - 'current std'
    - 'current kurtosis'
    - 'current skewness'
    - 'CC Q'
    - 'CC charge time'
    - 'CV Q'
    - 'CV charge time'
    - 'voltage slope'
    - 'current slope'
    - 'voltage entropy'
    - 'current entropy'
  target: 'capacity'
  nominal_capacity: 2.0
  preprocessing:
    outlier_method: "3sigma"
    fill_method: "mean"
    standardize: true
