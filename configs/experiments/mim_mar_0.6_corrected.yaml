# MIM + MAR (MR=0.6) + CNN1D 实验配置（修正版 - 多缺失率混合训练）

experiment:
  name: "mim_mar_0.6_cnn1d_corrected"
  description: "XJTU, MAR, MR=0.6, 1D-CNN + MIM-Multi (0.0-0.9), 20 seeds"
  type: "mim"
  use_mim: true
  missing_mode: "mar"
  missing_rate: 0.6

# MAR 参数
mar_params:
  alpha: null
  beta: 2.0
  gamma: 0.05

# 训练配置
training:
  epochs: 200
  batch_size: 64
  optimizer: "adam"
  learning_rate: 1.0e-3
  weight_decay: 0.0
  
  early_stopping:
    enabled: true
    monitor: "val_loss"
    patience: 15
    mode: "min"
  
  lr_scheduler:
    enabled: true
    type: "reduce_on_plateau"
    factor: 0.5
    patience: 5
  
  seeds:
    - 42
    - 101
    - 102
    - 103
    - 104
    - 105
    - 106
    - 107
    - 108
    - 109
    - 110
    - 111
    - 112
    - 113
    - 114
    - 115
    - 116
    - 117
    - 118
    - 119

output:
  result_csv: "results/csv/mar_0.6_cnn1d_mim_corrected.csv"
  save_models: false
  log_dir: "logs/experiments/mim_mar_0.6_corrected"
