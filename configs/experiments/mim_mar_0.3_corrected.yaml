# MIM + MAR (MR=0.3) + CNN1D 实验配置（修正版）
# 训练集使用多缺失率混合（0.0, 0.1, ..., 0.9）

experiment:
  name: "mim_mar_0.3_cnn1d_corrected"
  description: "XJTU, MAR, MR=0.3, 1D-CNN + MIM (corrected multi-MR training), 3 seeds"
  type: "mim"
  use_mim: true
  missing_mode: "mar"
  missing_rate: 0.3

# MAR 参数
mar_params:
  alpha: null  # 自动反推
  beta: 2.0
  gamma: 0.05

# 训练配置
training:
  epochs: 10  # 冒烟测试用10轮
  batch_size: 64
  optimizer: "adam"
  learning_rate: 1.0e-3
  weight_decay: 0.0
  
  # 早停
  early_stopping:
    enabled: true
    monitor: "val_loss"
    patience: 5
    mode: "min"
  
  # 学习率调度
  lr_scheduler:
    enabled: true
    type: "reduce_on_plateau"
    factor: 0.5
    patience: 3
  
  # 随机种子列表
  seeds:
    - 42
    - 101
    - 102

# 输出配置
output:
  result_csv: "results/csv/mar_0.3_cnn1d_mim_corrected.csv"
  save_models: false
  log_dir: "logs/experiments/mim_mar_0.3_corrected"
