# Baseline + MCAR 实验配置
# 不使用 MIM，仅使用插补后的数据

name: "baseline_mcar"
description: "Baseline (no MIM) with MCAR missing mechanism"

# 实验类型
type: "baseline"
use_mim: false
missing_mode: "mcar"

# 训练配置
training:
  epochs: 200
  batch_size: 64
  optimizer: "adam"
  learning_rate: 1.0e-3
  weight_decay: 0.0
  
  # 早停
  early_stopping:
    enabled: true
    monitor: "val_loss"
    patience: 15
    mode: "min"
  
  # 学习率调度
  lr_scheduler:
    enabled: true
    type: "reduce_on_plateau"
    factor: 0.5
    patience: 5
  
  # 随机种子列表 (20个)
  seeds:
    - 42
    - 101
    - 102
    - 103
    - 104
    - 105
    - 106
    - 107
    - 108
    - 109
    - 110
    - 111
    - 112
    - 113
    - 114
    - 115
    - 116
    - 117
    - 118
    - 119

# 输出配置
output:
  result_csv: "results/csv/baseline_mcar.csv"
  save_models: false
  log_dir: "logs/experiments/baseline_mcar"
