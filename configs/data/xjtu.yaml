# XJTU 数据集配置

dataset: "xjtu"
data_dir: "data/raw/XJTU"
batch: "3C"  # 可选: "2C", "3C", "R2.5", "R3", "RW", "Sim_satellite"

# 数据划分
split:
  test_size: 0.2
  val_size: 0.2
  random_state: 42

# 特征列 (16个特征) - 注意：实际CSV列名包含空格
features:
  - "voltage mean"
  - "voltage std"
  - "voltage kurtosis"
  - "voltage skewness"
  - "current mean"
  - "current std"
  - "current kurtosis"
  - "current skewness"
  - "CC Q"              # CC 充电容量
  - "CC charge time"    # CC 充电时间
  - "CV Q"              # CV 充电容量
  - "CV charge time"    # CV 充电时间
  - "voltage slope"     # 电压变化率
  - "current slope"     # 电流变化率
  - "voltage entropy"   # 电压熵
  - "current entropy"   # 电流熵

# 目标列
target: "capacity"  # SOH 通过 capacity / nominal_capacity 计算

# 预处理参数
preprocessing:
  remove_outliers: true
  outlier_method: "3sigma"  # 可选: "3sigma", "iqr"
  standardize: true
  fill_na: true
  fill_na_method: "mean"
