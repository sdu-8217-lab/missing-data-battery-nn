# @package data
dataset: "tju"
batch_id: "Dataset_1_NCA_battery"
data_dir: "./data/TJU data"

split:
  test_size: 0.25
  val_size: 0.25
  random_state: 42

seq_len: 5

features:
  - 'voltage mean'
  - 'voltage std' 
  - 'voltage kurtosis'
  - 'voltage skewness'
  - 'current mean'
  - 'current std'
  - 'current kurtosis'
  - 'current skewness'
  - 'CC Q'
  - 'CC charge time'
  - 'CV Q'
  - 'CV charge time'
  - 'voltage slope'
  - 'current slope'
  - 'voltage entropy'
  - 'current entropy'

target: 'capacity'
nominal_capacity: 2.5

preprocessing:
  outlier_method: "3sigma"
  fill_method: "mean"
  standardize: true
