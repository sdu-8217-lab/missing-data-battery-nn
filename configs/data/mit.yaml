# @package data
dataset: "mit"
batch_id: "mit"
data_dir: "./data/MIT data"

test_size: 0.25
val_size: 0.25
seq_len: 5

feature_cols:
  - 'voltage mean'
  - 'voltage std' 
  - 'voltage kurtosis'
  - 'voltage skewness'
  - 'current mean'
  - 'current std'
  - 'current kurtosis'
  - 'current skewness'
  - 'CC Q'
  - 'CC charge time'
  - 'CV Q'
  - 'CV charge time'
  - 'voltage slope'
  - 'current slope'
  - 'voltage entropy'
  - 'current entropy'

target_col: 'capacity'
