# @package _global_
defaults:
  - _self_
  - data: xjtu
  - model: mlp
  - missing: mcar

# 方法选择: mim, mean, median, knn, zero
# - mim: MIM 方法（混合缺失率训练，输入 32 维）
# - mean/median/knn/zero: 传统插补 baseline（输入 16 维）
method: "mim"

experiment:
  name: "battery_soh_experiment"
  seeds: [42, 43, 44, 45, 46]
  output_dir: "./results"

training:
  epochs: 100
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.0
  patience: 15
  device: "auto"

wandb:
  enabled: true
  project: "battery-soh"
  entity: null
  tags: []

logging:
  level: "INFO"
