# Hydra 主配置文件
# 使用方式: python src/main.py experiment=mim_mar_0.3 model=cnn1d

defaults:
  - data: xjtu
  - models: cnn1d
  - missing: mar
  - _self_

# 全局设置
device: "cuda"  # 可选: "cuda", "cpu", "auto"
seed: 42

# Weights & Biases 配置
wandb:
  project: "battery-soh-missing"
  entity: null  # 你的 WandB 用户名或团队名
  mode: "disabled"  # 可选: "online", "offline", "disabled"
  tags: []

# 日志配置
logging:
  level: "INFO"
  log_dir: "logs/experiments"
