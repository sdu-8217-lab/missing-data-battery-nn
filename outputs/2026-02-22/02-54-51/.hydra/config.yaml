data:
  dataset: xjtu
  data_dir: data/raw/XJTU
  batch: 3C
  split:
    test_size: 0.2
    val_size: 0.2
    random_state: 42
  features:
  - voltage mean
  - voltage std
  - voltage kurtosis
  - voltage skewness
  - current mean
  - current std
  - current kurtosis
  - current skewness
  - CC Q
  - CC charge time
  - CV Q
  - CV charge time
  - voltage slope
  - current slope
  - voltage entropy
  - current entropy
  target: capacity
  preprocessing:
    remove_outliers: true
    outlier_method: 3sigma
    standardize: true
    fill_na: true
    fill_na_method: mean
models:
  name: cnn1d
  input_dim: 32
  channels:
  - 32
  - 64
  - 64
  kernel_sizes:
  - 3
  - 3
  - 3
  strides:
  - 1
  - 1
  - 1
  padding: same
  fc_hidden_dims:
  - 64
  dropout: 0.1
  use_batch_norm: true
  activation: relu
missing:
  mode: mar
  missing_rates:
  - 0.3
  - 0.6
  - 0.9
  alpha: null
  beta: 2.0
  gamma: 0.05
  use_mim: true
experiments:
  experiment:
    name: mim_mar_0.3_cnn1d_smoke
    description: 'SMOKE TEST: XJTU, MAR, MR=0.3, 1D-CNN + MIM, 1 seed, 3 epochs'
    type: mim
    use_mim: true
    missing_mode: mar
    missing_rate: 0.3
  mar_params:
    alpha: null
    beta: 2.0
    gamma: 0.05
  training:
    epochs: 3
    batch_size: 32
    optimizer: adam
    learning_rate: 0.001
    weight_decay: 0.0
    early_stopping:
      enabled: true
      monitor: val_loss
      patience: 3
      mode: min
    lr_scheduler:
      enabled: true
      type: reduce_on_plateau
      factor: 0.5
      patience: 2
    seeds:
    - 42
  output:
    result_csv: results/csv/mar_0.3_cnn1d_mim_smoke.csv
    save_models: false
    log_dir: logs/experiments/mim_mar_0.3_smoke
device: cuda
seed: 42
wandb:
  project: battery-soh-missing
  entity: null
  mode: online
  tags: []
logging:
  level: INFO
  log_dir: logs/experiments
